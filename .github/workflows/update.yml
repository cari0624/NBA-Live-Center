name: Actualizar estadísticas NBA
on:
  workflow_dispatch:
  schedule:
    # 2 AM Central: 08:00 UTC winter, 07:00 UTC summer.
    - cron: '0 7,8 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar hora de Iowa (excepto ejecución manual)
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os,datetime
          from zoneinfo import ZoneInfo
          hour=datetime.datetime.now(ZoneInfo('America/Chicago')).hour
          allowed=os.environ['EVENT_NAME']=='workflow_dispatch' or hour==2
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f'run={str(allowed).lower()}\n')
          print('Iowa hour:',hour,'run:',allowed)
          PY
      - name: Descargar datos
        if: steps.clock.outputs.run == 'true'
        run: python scripts/update.py
      - name: Guardar datos actualizados
        if: steps.clock.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba.json
          git diff --cached --quiet || (git commit -m 'Actualizar estadísticas NBA' && git push)
